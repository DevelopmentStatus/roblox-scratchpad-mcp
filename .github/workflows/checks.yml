name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -v
      - run: python -m scratchpad_mcp --build-plugin scratchpad_plugin/ScratchpadBridge.rbxmx
      - run: git diff --exit-code -- scratchpad_plugin/ScratchpadBridge.rbxmx
      - run: python -m build
